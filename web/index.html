<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="MIP Studio pose les questions qu'un chef de projet poserait, et met vos réponses dans une forme qu'un agent suit. Gratuit, sans inscription."
    />
    <title>MIP Studio — cadrage de séquence</title>
    <!--
      Le thème est posé AVANT le premier rendu — sans quoi un système en sombre
      verrait un éclair blanc à chaque chargement. Script EXTERNE et non en
      ligne : la CSP du serveur interdit `script-src 'unsafe-inline'`, et un
      fichier même-origine est couvert par `'self'` sans hachage à maintenir.
      Bloquant dans le <head>, donc exécuté avant la peinture.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="racine"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
