<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="MIP Studio pose les questions qu'un chef de projet poserait, et met vos réponses dans une forme qu'un agent suit. Gratuit, sans inscription."
    />
    <title>MIP Studio — cadrage de séquence</title>

    <!-- Un favicon en SVG en ligne : pas de fichier binaire à versionner, et le
         « M » sur fond périwinkle suffit à distinguer l'onglet. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236d8cff'/%3E%3Ctext x='16' y='23' font-family='Segoe UI,sans-serif' font-size='20' font-weight='700' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E"
    />

    <!-- Partage social : sans ces balises, un lien collé sur un réseau s'affiche
         nu, sans titre ni image. Vu à l'audit du 2026-08-25. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MIP Studio" />
    <meta property="og:title" content="Bien guidée, votre IA va beaucoup plus loin" />
    <meta
      property="og:description"
      content="Le même modèle, dix minutes de cadrage. MIP Studio met vos réponses dans une forme qu'un agent suit. Gratuit, sans inscription."
    />
    <meta property="og:url" content="https://mip.miyukini.org/" />
    <meta property="og:image" content="https://mip.miyukini.org/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bien guidée, votre IA va beaucoup plus loin" />
    <meta
      name="twitter:description"
      content="Le même modèle, dix minutes de cadrage. Gratuit, sans inscription."
    />
    <meta name="twitter:image" content="https://mip.miyukini.org/og.png" />
    <!--
      Le thème est posé AVANT le premier rendu — sans quoi un système en sombre
      verrait un éclair blanc à chaque chargement. Script EXTERNE et non en
      ligne : la CSP du serveur interdit `script-src 'unsafe-inline'`, et un
      fichier même-origine est couvert par `'self'` sans hachage à maintenir.
      Bloquant dans le <head>, donc exécuté avant la peinture.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="racine"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
